<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Egypt Salary Calculator delivery and runtime architecture</title>
  <desc id="desc">GitHub main feeds independent quality and GitHub Pages deployment workflows. Pages serves the static React application at its repository path. Salary calculation stays in the browser. The browser fetches a dated USD/EGP reference rate directly from Frankfurter; the optional dotnet Function is an explicit separately hosted override.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#294155" stroke-width=".7" opacity=".24"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#75dbed"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#d7b572"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="18" fill="#09111e"/>
  <rect width="1200" height="760" rx="18" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="54" fill="#eef3f6" font-size="25" font-weight="700">Delivery and runtime</text>
    <text x="1152" y="52" fill="#d7b572" font-family="monospace" font-size="13" text-anchor="end">SOURCE-DERIVED / 09 SEP 2026</text>

    <rect x="38" y="82" width="1124" height="274" rx="16" fill="#0d1928" stroke="#2b3d50"/>
    <text x="64" y="116" fill="#75dbed" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1.5">DELIVERY PLANE</text>

    <rect x="70" y="158" width="178" height="82" rx="12" fill="#101d2d" stroke="#d7b572"/>
    <text x="159" y="190" fill="#d7b572" font-size="15" font-weight="700" text-anchor="middle">GitHub main</text>
    <text x="159" y="216" fill="#acbdca" font-family="monospace" font-size="12" text-anchor="middle">push / dispatch</text>

    <path d="M248 180H330" fill="none" stroke="#75dbed" stroke-width="2" marker-end="url(#arrow-cyan)"/>
    <path d="M289 180V294H330" fill="none" stroke="#75dbed" stroke-width="2" marker-end="url(#arrow-cyan)"/>

    <rect x="342" y="136" width="260" height="90" rx="12" fill="#101d2d" stroke="#75dbed"/>
    <text x="364" y="165" fill="#75dbed" font-size="14" font-weight="700">CI / quality</text>
    <text x="364" y="191" fill="#eef3f6" font-family="monospace" font-size="13">npm ci → 80 tests</text>
    <text x="364" y="211" fill="#acbdca" font-family="monospace" font-size="12">lint → production build</text>

    <rect x="342" y="250" width="260" height="90" rx="12" fill="#101d2d" stroke="#75dbed"/>
    <text x="364" y="279" fill="#75dbed" font-size="14" font-weight="700">Pages deployment</text>
    <text x="364" y="305" fill="#eef3f6" font-family="monospace" font-size="13">tests → lint → build</text>
    <text x="364" y="325" fill="#acbdca" font-family="monospace" font-size="12">dist → Pages artifact</text>

    <path d="M602 295H696" fill="none" stroke="#d7b572" stroke-width="2" marker-end="url(#arrow-gold)"/>
    <rect x="708" y="250" width="214" height="90" rx="12" fill="#142a35" stroke="#d7b572"/>
    <text x="815" y="280" fill="#d7b572" font-size="14" font-weight="700" text-anchor="middle">GitHub Pages project site</text>
    <text x="815" y="306" fill="#eef3f6" font-family="monospace" font-size="12" text-anchor="middle">dist / repository base</text>
    <text x="815" y="326" fill="#acbdca" font-family="monospace" font-size="11" text-anchor="middle">/egypt-salary-calculator/</text>

    <rect x="952" y="250" width="176" height="90" rx="12" fill="#101d2d" stroke="#485d70" stroke-dasharray="6 5"/>
    <text x="1040" y="280" fill="#eef3f6" font-size="14" font-weight="700" text-anchor="middle">Optional API</text>
    <text x="1040" y="305" fill="#acbdca" font-family="monospace" font-size="12" text-anchor="middle">not hosted by Pages</text>
    <text x="1040" y="325" fill="#8ca2b4" font-family="monospace" font-size="11" text-anchor="middle">separate host required</text>

    <rect x="38" y="382" width="1124" height="338" rx="16" fill="#0d1928" stroke="#2b3d50"/>
    <text x="64" y="416" fill="#75dbed" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1.5">RUNTIME / NO SALARY DATA LEAVES THE BROWSER</text>
    <rect x="70" y="453" width="310" height="230" rx="12" fill="#101d2d" stroke="#d7b572"/>
    <text x="225" y="485" fill="#d7b572" font-size="18" font-weight="700" text-anchor="middle">React browser client</text>
    <text x="225" y="512" fill="#acbdca" font-size="14" text-anchor="middle">Arabic RTL / static Pages assets</text>
    <rect x="96" y="536" width="258" height="57" rx="9" fill="#09111e" stroke="#d7b572"/>
    <text x="225" y="560" fill="#d7b572" font-family="monospace" font-size="14" text-anchor="middle">LOCAL SALARY ENGINE</text>
    <text x="225" y="581" fill="#acbdca" font-size="13" text-anchor="middle">EGP calculation independent of rates</text>
    <text x="225" y="620" fill="#75dbed" font-size="14" text-anchor="middle">Reference-rate client: 8s timeout</text>
    <text x="225" y="646" fill="#acbdca" font-size="13" text-anchor="middle">Pair, positive rate and ISO date checked</text>
    <text x="225" y="669" fill="#acbdca" font-size="13" text-anchor="middle">Dated USD estimate / retry on failure</text>
    <path d="M380 487H770" fill="none" stroke="#75dbed" stroke-width="2" marker-end="url(#arrow-cyan)"/>
    <text x="575" y="469" fill="#75dbed" font-size="15" font-weight="700" text-anchor="middle">DEFAULT: direct public GET</text>
    <text x="575" y="513" fill="#acbdca" font-family="monospace" font-size="12" text-anchor="middle">/v2/rate/USD/EGP</text>
    <text x="575" y="536" fill="#acbdca" font-size="13" text-anchor="middle">Open CORS / no key / no cookies</text>
    <rect x="786" y="453" width="342" height="105" rx="12" fill="#142a35" stroke="#75dbed"/>
    <text x="957" y="486" fill="#75dbed" font-size="19" font-weight="700" text-anchor="middle">Frankfurter</text>
    <text x="957" y="514" fill="#eef3f6" font-size="15" text-anchor="middle">Dated USD / EGP reference rate</text>
    <text x="957" y="539" fill="#acbdca" font-size="13" text-anchor="middle">Indicative, not a bank transaction quote</text>
    <path d="M380 622H493" fill="none" stroke="#8ca2b4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-cyan)"/>
    <rect x="508" y="581" width="252" height="102" rx="12" fill="#101d2d" stroke="#8ca2b4" stroke-dasharray="6 5"/>
    <text x="634" y="609" fill="#eef3f6" font-size="15" font-weight="700" text-anchor="middle">Optional .NET 10 Function</text>
    <text x="634" y="634" fill="#acbdca" font-family="monospace" font-size="12" text-anchor="middle">VITE_API_BASE_URL override</text>
    <text x="634" y="659" fill="#acbdca" font-size="13" text-anchor="middle">Unhosted / separate CORS required</text>
    <path d="M760 622H957V570" fill="none" stroke="#8ca2b4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-cyan)"/>
    <text x="963" y="661" fill="#acbdca" font-size="13" text-anchor="middle">Alternative path, not required by Pages</text>
  </g>
</svg>
